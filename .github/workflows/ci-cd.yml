name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token by default (least privilege); jobs ask for more only if needed
permissions:
  contents: read

# If a newer commit arrives, cancel the older run for the same branch
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code quality: lint, tests with coverage, dependency vulnerability audit
  # ---------------------------------------------------------------------------
  test:
    name: Lint, test and audit backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies and CI tools
        working-directory: backend
        run: pip install -r requirements.txt pytest-cov ruff pip-audit

      - name: Lint with ruff (syntax errors and unused or undefined names)
        working-directory: backend
        run: ruff check app --select E9,F

      - name: Run tests with coverage
        working-directory: backend
        run: |
          python -m pytest --cov=app --cov-report=term-missing
          echo "### Test coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # Advisory for now: reports known-vulnerable packages without failing the run
      - name: Audit Python dependencies for known vulnerabilities
        working-directory: backend
        continue-on-error: true
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # 2. Integration check: do the built images actually work together?
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Start the stack and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create env file from the example
        run: cp .env.example .env

      - name: Build and start all containers (waits until healthy)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Smoke tests through the web tier
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -qi "cloudops"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 3. Publish: build both images and push them to GitHub Container Registry
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push ${{ matrix.name }} image
    needs: [test, smoke-test]
    # Only publish from main, never from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cloudops-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true   # signed record of how and where the image was built
          sbom: true         # software bill of materials stored with the image
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record pushed tags in the run summary
        run: |
          echo "### Pushed ${{ matrix.name }} image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 4. Deploy: roll the new images out to AWS with an Auto Scaling Instance Refresh
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS (instance refresh)
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets the job request an OIDC token from GitHub
      contents: read
    env:
      AWS_REGION: eu-north-1
    steps:
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'EOF'
          import sys, json, base64
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("iss", "aud", "sub", "repository", "ref"):
              print(k, "=", c.get(k))
          EOF
          
      - name: Authenticate to AWS with OIDC (no stored access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::023065501030:role/cloudops-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out app tier, then web tier
        run: |
          set -euo pipefail
          for ASG in cloudops-app-asg cloudops-web-asg; do
            echo "Starting instance refresh for $ASG"
            REFRESH_ID=$(aws autoscaling start-instance-refresh \
              --auto-scaling-group-name "$ASG" \
              --preferences '{"MinHealthyPercentage":100,"MaxHealthyPercentage":200,"InstanceWarmup":300}' \
              --query InstanceRefreshId --output text)

            for i in $(seq 1 60); do
              STATUS=$(aws autoscaling describe-instance-refreshes \
                --auto-scaling-group-name "$ASG" \
                --instance-refresh-ids "$REFRESH_ID" \
                --query 'InstanceRefreshes[0].Status' --output text)
              echo "$ASG refresh $REFRESH_ID: $STATUS"
              case "$STATUS" in
                Successful) break ;;
                Failed|Cancelled|Cancelling) echo "Refresh did not succeed"; exit 1 ;;
              esac
              sleep 30
            done

            if [ "$STATUS" != "Successful" ]; then
              echo "Timed out waiting for $ASG"; exit 1
            fi
            echo "- $ASG: $STATUS ($REFRESH_ID)" >> "$GITHUB_STEP_SUMMARY"
          done